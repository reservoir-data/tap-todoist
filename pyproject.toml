[project]
name = "tap-todoist"
dynamic = ["version"]
description = ""
authors = [{ name = "Edgar Ramírez Mondragón", email = "edgarrm358@gmail.com" }]
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "requests~=2.34.0",
    "singer-sdk~=0.54.5",
    "requests-cache~=1.3.2",
]

[project.scripts]
tap-todoist = "tap_todoist.tap:TapTodoist.cli"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "ty>=0.0.55",
]

[tool.pyproject-fmt]
table_format = "long"

[tool.hatch.build.targets.sdist]
include = ["tap_todoist"]

[tool.hatch.build.targets.wheel]
include = ["tap_todoist"]

[tool.hatch.version]
fallback-version = "0.0.0.dev0"
source = "vcs"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.ruff.lint]
select = ["ALL"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
